name: Build iOS IPA

# ─────────────────────────────────────────────────────────────────────────────
# REQUIRED GitHub Repository Secret (Settings → Secrets → Actions):
#
#   EXPO_TOKEN  – your Expo personal access token
#                 Generate at: https://expo.dev/accounts/[your-account]/settings/access-tokens
#
# EAS handles all Apple certificates and provisioning profiles automatically.
# On first run you will need to log in to your Apple account interactively
# (run `npx eas build --platform ios --profile preview` locally once to set up
# credentials, then subsequent runs here are fully automated).
#
# Build profile is "preview" (internal distribution / ad-hoc).
# Change EAS_BUILD_PROFILE below to "production" for App Store / TestFlight.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        required: false
        default: 'preview'
        type: choice
        options:
          - preview
          - production

env:
  EAS_BUILD_PROFILE: ${{ inputs.profile || 'preview' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Node.js ───────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Install Expo & EAS CLI ────────────────────────────────────────────
      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # ── 4. Install JS dependencies ───────────────────────────────────────────
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # ── 5. Trigger EAS cloud build ───────────────────────────────────────────
      - name: Build iOS with EAS
        run: |
          eas build \
            --platform ios \
            --profile "$EAS_BUILD_PROFILE" \
            --non-interactive \
            --wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
