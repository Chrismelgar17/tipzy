name: Build iOS Simulator (Appetize)

on:
  workflow_dispatch:   # trigger manually from the GitHub Actions tab

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write   # required to create GitHub Releases

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Node.js ───────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── 3. Install JS deps ───────────────────────────────────────────────────
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # ── 3.5 Write .env so EXPO_PUBLIC_ vars are baked into the JS bundle ──────
      - name: Write production .env
        run: |
          echo "EXPO_PUBLIC_API_URL=https://tipzy-production.up.railway.app" >> .env
          echo "EXPO_PUBLIC_RORK_API_BASE_URL=https://tipzy-production.up.railway.app" >> .env
          echo "EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=938930558037-1ed436pos2lsn5onlhu1nnrr76eiu8ve.apps.googleusercontent.com" >> .env
          echo "EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID=938930558037-4fgl84q262kk9a130vhssc16sh5emi4l.apps.googleusercontent.com" >> .env
          echo "EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID=938930558037-c1okd0ccbc378r00eb05k7gs6adh7jl7.apps.googleusercontent.com" >> .env
          echo "EXPO_PUBLIC_GOOGLE_EXPO_CLIENT_ID=938930558037-1ed436pos2lsn5onlhu1nnrr76eiu8ve.apps.googleusercontent.com" >> .env
          echo "EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY=pk_test_51T8srNRsR6DpxA5rYEHltF828UIUcVMbFDoliYPnWRF4UsPseddgoN1H0gnWdzcAhPRGxKRG0vKUEHyHRkV8slvR00KL4OlfAi" >> .env

      # ── 4. Prebuild (generate ios/ native project) ───────────────────────────
      - name: Expo Prebuild
        env:
          NODE_ENV: production
          EXPO_PUBLIC_API_URL: https://tipzy-production.up.railway.app
          EXPO_PUBLIC_RORK_API_BASE_URL: https://tipzy-production.up.railway.app
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 938930558037-1ed436pos2lsn5onlhu1nnrr76eiu8ve.apps.googleusercontent.com
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: 938930558037-4fgl84q262kk9a130vhssc16sh5emi4l.apps.googleusercontent.com
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: 938930558037-c1okd0ccbc378r00eb05k7gs6adh7jl7.apps.googleusercontent.com
          EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_51T8srNRsR6DpxA5rYEHltF828UIUcVMbFDoliYPnWRF4UsPseddgoN1H0gnWdzcAhPRGxKRG0vKUEHyHRkV8slvR00KL4OlfAi
        run: npx expo prebuild --platform ios --clean --non-interactive

      # ── 5. CocoaPods ─────────────────────────────────────────────────────────
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ hashFiles('ios/Podfile') }}
          restore-keys: pods-

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      # ── 6. Build for simulator ───────────────────────────────────────────────
      - name: Build iOS Simulator
        env:
          NODE_ENV: production
          EXPO_PUBLIC_API_URL: https://tipzy-production.up.railway.app
          EXPO_PUBLIC_RORK_API_BASE_URL: https://tipzy-production.up.railway.app
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 938930558037-1ed436pos2lsn5onlhu1nnrr76eiu8ve.apps.googleusercontent.com
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: 938930558037-4fgl84q262kk9a130vhssc16sh5emi4l.apps.googleusercontent.com
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: 938930558037-c1okd0ccbc378r00eb05k7gs6adh7jl7.apps.googleusercontent.com
          EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_51T8srNRsR6DpxA5rYEHltF828UIUcVMbFDoliYPnWRF4UsPseddgoN1H0gnWdzcAhPRGxKRG0vKUEHyHRkV8slvR00KL4OlfAi
        run: |
          set -eo pipefail
          cd ios
          # Find the top-level .xcworkspace (not inside Pods/)
          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -1)
          if [ -z "$WORKSPACE" ]; then
            echo "ERROR: No .xcworkspace found in ios/"
            ls -la
            exit 1
          fi
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Using workspace: $WORKSPACE  scheme: $SCHEME"
          # Release config embeds the JS bundle — Debug expects a live Metro packager (breaks Appetize)
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath "$GITHUB_WORKSPACE/derived_data" \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            FORCE_BUNDLING=YES \
            build

      # ── 7. Package as .tar.gz for Appetize.io ─────────────────────────────────
      - name: Package .app as tar.gz
        run: |
          set -eo pipefail
          echo "Searching for .app in derived_data..."
          find "$GITHUB_WORKSPACE/derived_data" -name "*.app" -type d 2>/dev/null || true
          APP_PATH=$(find "$GITHUB_WORKSPACE/derived_data/Build/Products" -name "*.app" -type d | grep -v "\.appex" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found."
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          cd "$(dirname "$APP_PATH")"
          # Appetize requires .tar.gz — GitHub artifact download wraps .zip in another zip
          tar -czf "$GITHUB_WORKSPACE/Tipzy-simulator.tar.gz" "$(basename "$APP_PATH")"
          echo "Created Tipzy-simulator.tar.gz"
          ls -lh "$GITHUB_WORKSPACE/Tipzy-simulator.tar.gz"

      # ── 8. Publish as GitHub Release (downloads as raw .tar.gz, no extra zip wrapper) ──
      - name: Create GitHub Release with tar.gz
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="simulator-build-${{ github.run_number }}"
          gh release create "$TAG" \
            --title "iOS Simulator Build #${{ github.run_number }}" \
            --notes "Upload Tipzy-simulator.tar.gz directly to Appetize.io" \
            "$GITHUB_WORKSPACE/Tipzy-simulator.tar.gz#Tipzy-simulator.tar.gz"
