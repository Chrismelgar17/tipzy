name: Build iOS Simulator (Appetize)

on:
  workflow_dispatch:   # trigger manually from the GitHub Actions tab

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Node.js ───────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── 3. Install JS deps ───────────────────────────────────────────────────
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # ── 4. Prebuild (generate ios/ native project) ───────────────────────────
      - name: Expo Prebuild
        env:
          EXPO_PUBLIC_API_URL: https://tipzy-production.up.railway.app
          EXPO_PUBLIC_RORK_API_BASE_URL: https://tipzy-production.up.railway.app
        run: npx expo prebuild --platform ios --clean --non-interactive

      # ── 5. CocoaPods ─────────────────────────────────────────────────────────
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ hashFiles('ios/Podfile') }}
          restore-keys: pods-

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      # ── 6. Build for simulator ───────────────────────────────────────────────
      - name: Build iOS Simulator
        run: |
          set -eo pipefail
          cd ios
          # Find the top-level .xcworkspace (not inside Pods/)
          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -1)
          if [ -z "$WORKSPACE" ]; then
            echo "ERROR: No .xcworkspace found in ios/"
            ls -la
            exit 1
          fi
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Using workspace: $WORKSPACE  scheme: $SCHEME"
          # Use Debug config — Release strips symbols and can fail on Appetize simulator
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath "$GITHUB_WORKSPACE/derived_data" \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            build

      # ── 7. Package as .tar.gz for Appetize.io ─────────────────────────────────
      - name: Package .app as tar.gz
        run: |
          set -eo pipefail
          echo "Searching for .app in derived_data..."
          find "$GITHUB_WORKSPACE/derived_data" -name "*.app" -type d 2>/dev/null || true
          APP_PATH=$(find "$GITHUB_WORKSPACE/derived_data/Build/Products" -name "*.app" -type d | grep -v "\.appex" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found."
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          cd "$(dirname "$APP_PATH")"
          # Appetize requires .tar.gz — GitHub artifact download wraps .zip in another zip
          tar -czf "$GITHUB_WORKSPACE/Tipzy-simulator.tar.gz" "$(basename "$APP_PATH")"
          echo "Created Tipzy-simulator.tar.gz"
          ls -lh "$GITHUB_WORKSPACE/Tipzy-simulator.tar.gz"

      # ── 8. Upload artifact ───────────────────────────────────────────────────
      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: Tipzy-iOS-Simulator
          path: Tipzy-simulator.tar.gz
          retention-days: 7
